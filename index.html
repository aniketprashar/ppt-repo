<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Plan Runs · CSV Archive</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(17, 25, 47, .82);
      --panel-strong: #151e38;
      --line: rgba(148, 163, 184, .20);
      --text: #f8fafc;
      --muted: #9aa9c4;
      --accent: #7c9cff;
      --accent-2: #64e1c4;
      --danger: #ff8797;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% -10%, rgba(124, 156, 255, .25), transparent 33rem),
        radial-gradient(circle at 96% 5%, rgba(100, 225, 196, .13), transparent 24rem),
        var(--bg);
    }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 48px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 7px 11px;
      color: #c6d2ff; background: rgba(124, 156, 255, .12); border: 1px solid rgba(124, 156, 255, .25);
      border-radius: 999px; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; background: var(--accent-2); border-radius: 50%; box-shadow: 0 0 16px var(--accent-2); }
    h1 { max-width: 720px; margin: 0; font-size: clamp(2.25rem, 6vw, 4.5rem); letter-spacing: -.055em; line-height: .98; }
    .lede { max-width: 620px; margin: 19px 0 34px; color: var(--muted); font-size: 1.07rem; line-height: 1.7; }

    .workspace {
      overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
      box-shadow: 0 30px 75px rgba(0, 0, 0, .25); backdrop-filter: blur(16px);
    }
    .controls {
      display: flex; flex-wrap: wrap; align-items: end; gap: 14px; padding: 22px; border-bottom: 1px solid var(--line);
    }
    .field { display: grid; gap: 8px; min-width: min(100%, 315px); flex: 1 1 315px; }
    .field.search { flex: 1 1 240px; }
    label { color: var(--muted); font-size: .77rem; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; }
    select, input, .download {
      width: 100%; min-height: 46px; padding: 0 14px; color: var(--text); background: rgba(4, 8, 21, .6);
      border: 1px solid var(--line); border-radius: 12px; outline: none; font: inherit;
    }
    select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(124, 156, 255, .14); }
    .download {
      display: inline-flex; align-items: center; justify-content: center; width: auto; padding: 0 17px;
      color: #0b1020; background: var(--accent-2); border: 0; font-size: .9rem; font-weight: 800; text-decoration: none;
      transition: transform .15s ease, filter .15s ease;
    }
    .download:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
    .metric { min-width: 0; padding: 18px 22px; background: rgba(11, 16, 32, .42); }
    .metric span { display: block; overflow: hidden; color: var(--muted); font-size: .77rem; font-weight: 700; letter-spacing: .06em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .metric strong { display: block; margin-top: 5px; font-size: 1.35rem; letter-spacing: -.03em; }

    .table-area { overflow: auto; max-height: min(62vh, 630px); }
    table { width: 100%; border-collapse: collapse; font-size: .94rem; }
    th, td { min-width: 150px; padding: 14px 20px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th {
      position: sticky; top: 0; z-index: 1; color: #cbd7ee; background: var(--panel-strong);
      font-size: .74rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: rgba(124, 156, 255, .08); }
    td { color: #dce5f5; }
    .empty { padding: 56px 22px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 1.05rem; }
    .error { color: var(--danger); }

    .footer { display: flex; justify-content: space-between; gap: 12px; padding: 16px 22px; color: var(--muted); font-size: .82rem; }
    .footer a { color: #bdcaff; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 36px; }
      .controls, .metric { padding: 16px; }
      .summary { grid-template-columns: 1fr; }
      .download { width: 100%; }
      .footer { display: block; line-height: 1.7; }
      th, td { padding: 13px 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow"><span class="dot"></span> CSV archive</div>
    <h1>Plan runs,<br>made readable.</h1>
    <p class="lede">Browse the CSV produced by each run, search its rows, and download the original file whenever you need it.</p>

    <section class="workspace" aria-label="CSV data viewer">
      <div class="controls">
        <div class="field">
          <label for="file">Dataset</label>
          <select id="file"></select>
        </div>
        <div class="field search">
          <label for="search">Search rows</label>
          <input id="search" type="search" placeholder="Filter this dataset…" autocomplete="off">
        </div>
        <a id="download" class="download" href="#" download>Download CSV</a>
      </div>

      <div class="summary" aria-live="polite">
        <div class="metric"><span>Available runs</span><strong id="run-count">0</strong></div>
        <div class="metric"><span>Visible rows</span><strong id="row-count">—</strong></div>
        <div class="metric"><span>Columns</span><strong id="column-count">—</strong></div>
      </div>

      <div class="table-area">
        <table id="table">
          <thead id="headers"></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden></div>
      </div>

      <footer class="footer">
        <span id="status">Loading dataset…</span>
        <a id="raw-file" href="#" target="_blank" rel="noopener">Open raw CSV ↗</a>
      </footer>
    </section>
  </main>

  <script>
    // Add each future generated CSV here. A workflow can later update this list automatically.
    const datasets = [
      { label: "Run 1", file: "data/run-1.csv" },
      { label: "Run 2", file: "data/run-2.csv" }
    ];

    const fileSelect = document.querySelector("#file");
    const searchInput = document.querySelector("#search");
    const download = document.querySelector("#download");
    const rawFile = document.querySelector("#raw-file");
    const headerRow = document.querySelector("#headers");
    const bodyRows = document.querySelector("#rows");
    const empty = document.querySelector("#empty");
    const status = document.querySelector("#status");
    const rowCount = document.querySelector("#row-count");
    const columnCount = document.querySelector("#column-count");
    document.querySelector("#run-count").textContent = datasets.length;

    let headers = [];
    let records = [];

    function parseCsv(text) {
      const rows = [], row = [];
      let cell = "", quoted = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (quoted) {
          if (char === '"' && text[i + 1] === '"') { cell += '"'; i += 1; }
          else if (char === '"') quoted = false;
          else cell += char;
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(cell); cell = "";
        } else if (char === "\n" || char === "\r") {
          if (char === "\r" && text[i + 1] === "\n") i += 1;
          row.push(cell); rows.push(row.splice(0)); cell = "";
        } else {
          cell += char;
        }
      }
      if (cell || row.length) { row.push(cell); rows.push(row); }
      return rows.filter(row => row.some(cell => cell.trim() !== ""));
    }

    function setEmpty(title, detail, isError = false) {
      document.querySelector("#table").hidden = true;
      empty.hidden = false;
      empty.classList.toggle("error", isError);
      empty.replaceChildren();
      const heading = document.createElement("strong");
      heading.textContent = title;
      const text = document.createElement("span");
      text.textContent = detail;
      empty.append(heading, text);
    }

    function renderTable() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const visible = query
        ? records.filter(row => row.some(cell => cell.toLocaleLowerCase().includes(query)))
        : records;

      headerRow.replaceChildren();
      const headerTr = document.createElement("tr");
      headers.forEach(header => {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = header || "Untitled";
        headerTr.appendChild(th);
      });
      headerRow.appendChild(headerTr);

      bodyRows.replaceChildren(...visible.map(record => {
        const tr = document.createElement("tr");
        headers.forEach((_, index) => {
          const td = document.createElement("td");
          td.textContent = record[index] || "";
          tr.appendChild(td);
        });
        return tr;
      }));

      document.querySelector("#table").hidden = false;
      empty.hidden = visible.length > 0;
      rowCount.textContent = visible.length.toLocaleString();
      columnCount.textContent = headers.length.toLocaleString();
      status.textContent = visible.length === records.length
        ? "Showing all rows in " + fileSelect.selectedOptions[0].text
        : "Showing " + visible.length + " of " + records.length + " rows";
      if (!visible.length) setEmpty("No matching rows", "Try a different search term.");
    }

    async function loadDataset() {
      const selected = datasets[fileSelect.selectedIndex];
      if (!selected) return;

      searchInput.value = "";
      status.textContent = "Loading " + selected.label + "…";
      download.href = selected.file;
      download.download = selected.file.split("/").pop();
      rawFile.href = selected.file;

      try {
        const response = await fetch(selected.file, { cache: "no-store" });
        if (!response.ok) throw new Error("The file could not be loaded (" + response.status + ").");

        const parsed = parseCsv(await response.text());
        headers = parsed.shift() || [];
        records = parsed;
        if (!headers.length) {
          rowCount.textContent = "0";
          columnCount.textContent = "0";
          setEmpty("This CSV is empty", "Add a header row and data rows, then reload.");
          return;
        }
        renderTable();
      } catch (error) {
        rowCount.textContent = "—";
        columnCount.textContent = "—";
        setEmpty("Could not load this CSV", error.message, true);
        status.textContent = "Load failed";
      }
    }

    datasets.forEach(dataset => {
      const option = document.createElement("option");
      option.value = dataset.file;
      option.textContent = dataset.label;
      fileSelect.appendChild(option);
    });

    fileSelect.addEventListener("change", loadDataset);
    searchInput.addEventListener("input", renderTable);
    loadDataset();
  </script>
</body>
</html>
